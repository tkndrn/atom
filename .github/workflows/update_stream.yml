name: Otomatik M3U8 Guncelleyici

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik calisir
  workflow_dispatch: # GitHub sayfasindan elle tetikleme butonu

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodlari ice aktar
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bagimliliklari yukle
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Extractor Scriptini Calistir
        run: python extractor.py

      - name: Guncel linki repoya kaydet ve gonder
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add stream.txt
          git commit -m "Otomatik m3u8 link guncellemesi [skip ci]" || exit 0
          git push
