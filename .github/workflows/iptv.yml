name: Generator

on:
  schedule:
    - cron: '0 0 * * *' # Her gün gece yarısı çalıştır
  workflow_dispatch:    # Manuel çalıştırma butonu ekler

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Kütüphaneleri kur
        run: pip install undetected-chromedriver
        
      - name: Scripti çalıştır
        run: python generator.py
        
      - name: M3U dosyasını kaydet (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: iptv-listesi
          path: iptv_listem.m3u
